<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>เพลงของเรา ♡</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, "Noto Sans Thai", sans-serif;

  background:
    radial-gradient(
      circle at center,
      #fffaf8 0%,
      #f9dfdc 50%,
      #f3c9c5 100%
    );

  color: #59372e;
  overflow: hidden;
}


/* =========================
   หัวใจลอยพื้นหลัง
========================= */

.hearts {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.heart {
  position: absolute;
  bottom: -60px;
  color: #e79b98;
  opacity: 0;

  animation:
    floatHeart
    linear infinite;
}

@keyframes floatHeart {

  0% {
    transform:
      translateY(0)
      rotate(0deg)
      scale(.7);

    opacity: 0;
  }

  15% {
    opacity: .6;
  }

  70% {
    opacity: .35;
  }

  100% {
    transform:
      translateY(-115vh)
      rotate(25deg)
      scale(1.2);

    opacity: 0;
  }

}


/* =========================
   หน้า
========================= */

.page {
  min-height: 100vh;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  padding: 20px;

  position: relative;
  z-index: 2;
}


/* =========================
   หัวข้อ
========================= */

.title {
  text-align: center;
  margin-bottom: 22px;
}

.title-heart {
  font-size: 38px;
  color: #d98f88;
}

.title h1 {
  margin: 5px 0;

  font-family: Georgia, serif;
  font-style: italic;

  font-size:
    clamp(38px, 9vw, 55px);
}

.title p {
  margin: 0;
  color: #8b655b;
}


/* =========================
   กล่องเพลง
========================= */

.music-card {

  width: min(90vw, 390px);

  background:
    rgba(255,250,247,.95);

  padding: 22px;

  border-radius: 30px;

  text-align: center;

  box-shadow:
    0 20px 55px
    rgba(90,50,40,.18);

}


/* =========================
   รูปปกเพลง
========================= */

.cover {

  width: 100%;

  aspect-ratio: 1 / 1;

  border-radius: 22px;

  overflow: hidden;

  box-shadow:
    0 15px 35px
    rgba(90,50,40,.2);

  margin-bottom: 20px;

}

.cover img {

  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;

}


/* =========================
   ชื่อเพลง
========================= */

.song-name {

  font-family: Georgia, serif;

  font-size: 24px;

  font-weight: bold;

  margin-top: 5px;

}

.artist {

  color: #8b655b;

  margin-top: 5px;

  font-size: 14px;

}


/* =========================
   ปุ่มเล่น
========================= */

.play-button {

  width: 65px;
  height: 65px;

  border: none;

  border-radius: 50%;

  background: #e89f96;

  color: white;

  font-size: 25px;

  cursor: pointer;

  margin-top: 20px;

  box-shadow:
    0 8px 20px
    rgba(150,80,70,.25);

  transition: .2s;

}

.play-button:hover {
  transform: scale(1.08);
}


/* =========================
   แถบเพลง
========================= */

.progress {

  width: 100%;

  margin-top: 20px;

}

#progress {

  width: 100%;

  accent-color: #d98f88;

  cursor: pointer;

}

.time {

  display: flex;

  justify-content: space-between;

  color: #98766c;

  font-size: 12px;

  margin-top: 5px;

}


/* =========================
   ปุ่มกลับ
========================= */

.back {

  margin-top: 22px;

  padding:
    14px 24px;

  border-radius: 30px;

  background:
    rgba(255,255,255,.8);

  color: #59372e;

  text-decoration: none;

  font-weight: bold;

  box-shadow:
    0 8px 20px
    rgba(90,50,40,.12);

}

</style>

</head>


<body>


<!-- =========================
     หัวใจพื้นหลัง
========================= -->

<div class="hearts">

  <div class="heart"
       style="left:5%;font-size:25px;animation-duration:9s;">
    ♡
  </div>

  <div class="heart"
       style="left:18%;font-size:35px;animation-duration:12s;animation-delay:2s;">
    ♥
  </div>

  <div class="heart"
       style="left:32%;font-size:18px;animation-duration:10s;animation-delay:5s;">
    ♡
  </div>

  <div class="heart"
       style="left:48%;font-size:30px;animation-duration:14s;animation-delay:1s;">
    ♥
  </div>

  <div class="heart"
       style="left:65%;font-size:20px;animation-duration:11s;animation-delay:4s;">
    ♡
  </div>

  <div class="heart"
       style="left:80%;font-size:38px;animation-duration:13s;animation-delay:3s;">
    ♥
  </div>

  <div class="heart"
       style="left:93%;font-size:25px;animation-duration:10s;animation-delay:6s;">
    ♡
  </div>

</div>


<!-- =========================
     เนื้อหา
========================= -->

<div class="page">


  <div class="title">

    <div class="title-heart">
      ♡
    </div>

    <h1>
      เพลงของเรา
    </h1>

    <p>
      เพลงที่ทำให้เรานึกถึงกัน ♡
    </p>

  </div>


  <!-- =========================
       กล่องเพลง
  ========================= -->

  <div class="music-card">


    <!-- รูปปก -->

    <div class="cover">

      <img
        src="IMG_0059.jpeg"
        alt="ปกเพลงของเรา">

    </div>


    <!-- ชื่อเพลง -->

    <div class="คืนจันทร์">
      เพลงของเรา
    </div>

    <div class="เสกโลโซ">
      ♡ เพลงที่อยากให้เธอฟัง
    </div>


    <!-- ไฟล์เพลง -->

    <audio id="audio">

      <source
        src="คนจนทร - LOSO OFFICIAL MV_[cut_265sec].mp3"
        type="audio/mpeg">

      เบราว์เซอร์ไม่รองรับเสียง

    </audio>


    <!-- ปุ่มเล่น -->

    <button
      class="play-button"
      id="playButton"
      onclick="toggleMusic()">

      ▶

    </button>


    <!-- แถบเวลา -->

    <div class="progress">

      <input
        type="range"
        id="progress"
        value="0"
        min="0"
        max="100">

      <div class="time">

        <span id="current">
          0:00
        </span>

        <span id="duration">
          0:00
        </span>

      </div>

    </div>


  </div>


  <!-- กลับหน้าหลัก -->

  <a
    class="back"
    href="index.html">

    ♡ กลับไปหน้าหลัก

  </a>


</div>


<script>

const audio =
  document.getElementById("audio");

const playButton =
  document.getElementById("playButton");

const progress =
  document.getElementById("progress");

const current =
  document.getElementById("current");

const duration =
  document.getElementById("duration");


/* =========================
   เล่น / หยุดเพลง
========================= */

function toggleMusic() {

  if (audio.paused) {

    audio.play();

    playButton.innerHTML = "Ⅱ";

  } else {

    audio.pause();

    playButton.innerHTML = "▶";

  }

}


/* =========================
   โหลดความยาวเพลง
========================= */

audio.addEventListener(
  "loadedmetadata",
  function() {

    duration.innerHTML =
      formatTime(audio.duration);

  }
);


/* =========================
   อัปเดตเวลา
========================= */

audio.addEventListener(
  "timeupdate",
  function() {

    if (!audio.duration) {
      return;
    }

    progress.value =
      (audio.currentTime /
       audio.duration) * 100;

    current.innerHTML =
      formatTime(audio.currentTime);

  }
);


/* =========================
   เลื่อนเพลง
========================= */

progress.addEventListener(
  "input",
  function() {

    if (!audio.duration) {
      return;
    }

    audio.currentTime =
      (progress.value / 100) *
      audio.duration;

  }
);


/* =========================
   เพลงจบ
========================= */

audio.addEventListener(
  "ended",
  function() {

    playButton.innerHTML = "▶";

    progress.value = 0;

    current.innerHTML = "0:00";

  }
);


/* =========================
   แปลงวินาทีเป็นเวลา
========================= */

function formatTime(seconds) {

  if (isNaN(seconds)) {
    return "0:00";
  }

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    Math.floor(seconds % 60);

  return (
    minutes +
    ":" +
    String(secs).padStart(2, "0")
  );

}

</script>


</body>

</html>
